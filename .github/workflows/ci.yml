name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the exe is named after the commit

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          black --check .

      # Offscreen Qt, fake PCAN driver: no adapter and no PEAK driver needed.
      # CI=true (set by GitHub) skips the tests that measure this machine's
      # timer precision rather than CANino's code.
      # faulthandler: a native crash (Qt abort) prints the Python stack
      # instead of ending the step with a bare exit code
      - name: Tests
        run: python -X faulthandler -m unittest discover -s tests -v

      - name: Build exe
        run: pyinstaller --noconfirm CANinoApp_exe_setup.spec

      - uses: actions/upload-artifact@v4
        with:
          name: CANinoApp-exe
          path: dist/*.exe
          if-no-files-found: error
